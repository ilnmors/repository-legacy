---
# Node Factors
node:
  name: "auth"
  group: "svadmins"
  uid: 2003
  home_path: "/home/auth"
  ssh_san: "{{ node['name'] }},{{ node['name'] }}.{{ domain['internal'] }}"
  local_san: "localhost {{ node['name'] }}.{{ domain['internal'] }}"
# VM Factors
vm:
  name: "auth"
  cpu: 2
  cpu_pin: |
    <vcpupin vcpu='0' cpuset='8'/>
    <vcpupin vcpu='1' cpuset='9'/>
    <emulatorpin cpuset='8-9'/>
  shares: 1024
  memory: 2
  storage: 64
  lan_mac: "0a:49:6e:4d:02:00"
  lan_net: "lan-net"
  lan_group: "vlan10-access"
