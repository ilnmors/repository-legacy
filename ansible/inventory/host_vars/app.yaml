---
# Node Factors
node:
  name: "app"
  group: "svadmins"
  uid: 2004
  home_path: "/home/app"
  ssh_san: "{{ node['name'] }},{{ node['name'] }}.{{ domain['internal'] }}"
  local_san: "localhost {{ node['name'] }}.{{ domain['internal'] }}"
# VM Factors
vm:
  name: "app"
  cpu: 6
  cpu_pin: |
    <vcpupin vcpu='0' cpuset='0'/>
    <vcpupin vcpu='1' cpuset='1'/>
    <vcpupin vcpu='2' cpuset='2'/>
    <vcpupin vcpu='3' cpuset='3'/>
    <vcpupin vcpu='4' cpuset='10'/>
    <vcpupin vcpu='5' cpuset='11'/>
    <emulatorpin cpuset='10-11'/>
  shares: 1024
  memory: 16
  storage: 256
  data_storage:
    name: "vdb"
    pool: "data"
    size: 1.75
  lan_mac: "0a:49:6e:4d:03:00"
  lan_net: "lan-net"
  lan_group: "vlan10-access"
