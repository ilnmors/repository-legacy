---
# Node Factors
node:
  name: "infra"
  group: "svadmins"
  uid: 2002
  home_path: "/home/infra"
  ssh_san: "{{ node['name'] }},{{ node['name'] }}.{{ domain['internal'] }}"
  local_san: "localhost {{ node['name'] }}.{{ domain['internal'] }}"

# VM Factors
vm:
  name: "infra"
  cpu: 4
  cpu_pin: |
    <vcpupin vcpu='0' cpuset='2'/>
    <vcpupin vcpu='1' cpuset='3'/>
    <vcpupin vcpu='2' cpuset='8'/>
    <vcpupin vcpu='3' cpuset='9'/>
    <emulatorpin cpuset='8-9'/>
  shares: 2048
  memory: 6
  storage: 256
  lan_mac: "0a:49:6e:4d:01:00"
  lan_net: "lan-net"
  lan_group: "vlan10-access"
