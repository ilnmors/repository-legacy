---
# Node Factors
node:
  name: "bk"
  group: "svadmins"
  uid: 2009
  home_path: "/home/bk"
  ssh_san: "{{ node['name'] }},{{ node['name'] }}.{{ domain['internal'] }}"
  local_san: "localhost {{ node['name'] }}.{{ domain['internal'] }}"
# VM Factors
vm:
  name: "bk"
  cpu: 2
  cpu_pin: |
    <vcpupin vcpu='0' cpuset='6'/>
    <vcpupin vcpu='1' cpuset='7'/>
    <emulatorpin cpuset='6-7'/>
  shares: 512
  memory: 2
  storage: 32
  data_storage:
    name: "vdb"
    pool: "backup"
    size: 3.5
  lan_mac: "0a:49:6e:4d:09:00"
  lan_net: "lan-net"
  lan_group: "vlan10-access"
