---
node:
  name: "vmm"
  group: "svadmins"
  uid: 2000
  home_path: "/home/vmm"
  libvirt_path: "/var/lib/libvirt"
  ssh_san: "{{ node['name'] }},{{ node['name'] }}_init,{{ node['name'] }}.{{ domain['internal'] }},init.{{ node['name'] }}.{{ domain['internal'] }}"
  local_san: "localhost {{ node['name'] }}.{{ domain['internal'] }}"

hardware:
  mac:
    nic0: "c8:ff:bf:07:02:34"
    nic1: "c8:ff:bf:07:02:33"
    sfpp0: "c8:ff:bf:07:02:31"
    sfpp1: "c8:ff:bf:07:02:32"
  igpu:
    id: "8086:4628"
    address: "0000:00:02.0"
    domain: "0x0000"
    bus: "0x00"
    slot: "0x02"
    function: "0x0"
  disk:
    # NVMe is set when the hypervisor is initiated manually.
    nvme:
      serials:
        - "S5GXNX0T228635E"
      fs:
        type: "ext4"
        label: ""
        mount_point:
          - "/"
          - "/var/lib/libvirt"
        mount_opts: ""
    data:
      serials:
        - "WMC6N0E617S8"
        - "PN1134P6HVTL0W"
        - "PN1138P2GH354H"
        - "PN2131P6GJKSMP"
      fs:
        type: "btrfs"
        label: "DATA"
        mount_point: "{{ node['libvirt_path'] }}/disk/data"
        mount_opts:
          - "defaults"
          - "noatime"
          - "nodatacow"
          - "degraded"
          - "nofail"
        btrfs:
          data_profile: "raid10"
          metadata_profile: "raid10"
          min_devices: 4
    backup:
      serials:
        - "6261S5G4S75H"
      fs:
        type: "btrfs"
        label: "BACKUP"
        mount_point: "{{ node['libvirt_path'] }}/disk/backup"
        mount_opts:
          - "defaults"
          - "noatime"
          - "nodatacow"
          - "nofail"
        btrfs:
          data_profile: "single"
          metadata_profile: "dup"
          min_devices: 1
