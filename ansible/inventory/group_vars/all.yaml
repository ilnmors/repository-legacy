---
# Global vars
timezone: "Asia/Seoul"
ansible_ssh_private_key_file: "/etc/secrets/{{ hostvars['console']['node']['uid'] }}/id_console"

# CA
root_cert_filename: "ilnmors_root_ca.crt"
intermediate_cert_filename: "ilnmors_intermediate_ca.crt"
intermediate_key_filename: "ilnmors_intermediate_ca.key"

# Domains
domain:
  public: "ilnmors.com"
  internal: "ilnmors.internal"
  dc: "dc=ilnmors,dc=internal"
  org: "ilnmors"

services:
  # common
  wireguard:
    domain:
      public: "vpn"
    ports:
      udp: "11290"
  crowdsec:
    domain:
      internal: "crowdsec"
    ports:
      https: "8080"
    sub:
      machines:
        - "fw"
        - "vmm"
        - "bk"
        - "infra"
        - "auth"
        - "app"
      bouncers:
        - "fw"
        - "caddy"
    dependency:
      cert: true
  kopia:
    domain:
      internal: "kopia"
    ports:
      https: "51515"
    uid: "951"
    dependency:
      cert: true
  caddy:
    ports:
      http: "2080"
      https: "2443"
  # fw
  bind:
    domain:
      internal: "bind"
    ports:
      dns: "53"
  blocky:
    domain:
      internal: "blocky"
    ports:
      https: "443"
      dns: "53"
      dot: "853"
    dependency:
      cert: true
  # infra
  rustfs:
    domain:
      internal: "rustfs"
      public: "rustfs"
    ports:
      http: "9001"
    subuid: "110000"
    dependency:
      web: "infra-public"
  postgresql:
    domain:
      internal: "postgresql"
    ports:
      tcp: "5432" # postgresql db connection port
    subuid: "100998"
    dependency:
      cert: true
  mariadb:
    domain:
      internal: "mariadb"
    ports:
      tcp: "3306" # mariadb db connection port
    subuid: "100998"
    dependency:
      cert: true
  ldap:
    domain:
      internal: "ldap"
    ports:
      http: "17170"
      ldaps: "6360"
    subuid: "100999"
    dependency:
      cert: true
      web: "infra-internal"
      db: "postgresql"
  postfix:
    domain:
      internal: "smtp"
    ports:
      smtp: "2587"
    mail:
      domains: ["ilnmors.internal"]
      groups: ["admins", "users", "services"]
      postmaster: "il"
      relay:
        status: false
        host: ""
        port: 587
    dependency:
      cert: true
  dovecot:
    domain:
      internal: "imap"
    ports:
      imaps: "2993"
    subuid: "100999"
    mail:
      groups: ["admins", "users"]
    dependency:
      cert: true
  ca:
    domain:
      internal: "ca"
    ports:
      https: "9000"
    subuid: "100999"
  x509-exporter:
    ports:
      http: "9793"
    subuid: "165533"
  prometheus:
    domain:
      internal: "prometheus"
    ports:
      https: "9090"
    subuid: "165533"
    dependency:
      cert: true
      web: "infra-internal"
  loki:
    domain:
      internal: "loki"
    ports:
      https: "3100"
    subuid: "110000"
    dependency:
      cert: true
  grafana:
    domain:
      internal: "grafana"
    ports:
      http: "3000" # infra
    subuid: "100471"
    dependency:
      web: "infra-internal"
      db: "postgresql"
  # auth
  authelia:
    domain:
      public: "authelia"
    ports:
      http: "9091"
    dependency:
      web: "auth-public"
      db: "postgresql"
  # app
  valkey:
    subuid: "100998"
  homepage:
    domain:
      public: "@"
      internal: "homepage.app"
    ports:
      http: "3000" # app
    dependency:
      web: "app-public"
  quartermaster:
    domain:
      internal: "quartermaster.app"
    ports:
      http: "10000"
    dependency:
      # internal only: the dashboard runs with -admin-open
      web: "app-internal"
    # llama-swap style config; llama-server and sd-server are bundled under /opt/quartermaster/backends
    macros:
      llama: >-
        /opt/quartermaster/backends/bin/llama-server/b10796-vulkan/llama-b10796/llama-server
        --host 127.0.0.1 --port ${PORT} --n-gpu-layers 999 --kv-unified
        --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn auto --jinja
      sd: >-
        /opt/quartermaster/backends/bin/sd-server/master-841-6b3edaa-vulkan/sd-server
        --listen-ip 127.0.0.1 --listen-port ${PORT}
    models:
      LFM2.5-24B-A2B-Heretic:
        cmd: >-
          ${llama} --model /data/models/LFM2.5-24B-A2B-Heretic/model.gguf
          --ctx-size 65536 --parallel 2
      LFM2.5-VL-3B-Heretic:
        cmd: >-
          ${llama} --model /data/models/LFM2.5-VL-3B-Heretic/model.gguf
          --mmproj /data/models/LFM2.5-VL-3B-Heretic/mmproj.gguf
          --ctx-size 32768 --parallel 1 --reasoning-budget 0
      LFM2.5-Embedding-350M:
        cmd: >-
          ${llama} --model /data/models/LFM2.5-Embedding-350M/model.gguf
          --embedding --pooling cls --ctx-size 1024 --parallel 1
      zImage-moodyRealMix:
        cmd: >-
          ${sd} --diffusion-model /data/models/zImage/moodyRealMix_zitV7Global-Q8_0.gguf
          --llm /data/models/zImage/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          --vae /data/models/zImage/ae.safetensors
          --cfg-scale 1.0 --steps 9 --vae-tiling --vae-tile-size 32x32 --vae-tile-overlap 0.5
        checkEndpoint: "/v1/models"
    groups:
      resident:
        swap: false
        exclusive: false
        persistent: true
        members: ["LFM2.5-24B-A2B-Heretic", "LFM2.5-VL-3B-Heretic", "LFM2.5-Embedding-350M", "zImage-moodyRealMix"]
    preload: ["LFM2.5-24B-A2B-Heretic", "LFM2.5-VL-3B-Heretic", "LFM2.5-Embedding-350M", "zImage-moodyRealMix"]
  openwebui:
    domain:
      public: "openwebui"
      internal: "openwebui.app"
    ports:
      http: "8002"
    dependency:
      web: "app-public"
      db: "postgresql"
  snappymail:
    domain:
      public: "webmail"
      internal: "webmail.app"
    ports:
      http: "8888"
    subuid: "100081"
    dependency:
      web: "app-public"
  vaultwarden:
    domain:
      public: "vault"
      internal: "vault.app"
    ports:
      http: "8000"
    dependency:
      web: "app-public"
      db: "postgresql"
  linkding:
    domain:
      public: "linkding"
      internal: "linkding.app"
    ports:
      http: "9090"
    subuid: "100032"
    dependency:
      web: "app-public"
      db: "postgresql"
  forgejo:
    domain:
      public: "forgejo"
      internal: "forgejo.app"
    ports:
      http: "3001"
    subuid: "100999"
    dependency:
      web: "app-public"
      db: "postgresql"
  mastodon:
    domain:
      public: "mastodon"
      internal: "mastodon.app"
    ports:
      http: "3002"
      api: "4000"
      valkey: "6379"
    subuid: "100990"
    route:
      api: "/api/v1/streaming*"
    dependency:
      web: "app-public"
      db: "postgresql"
  kaneo:
    domain:
      public: "kaneo"
      internal: "kaneo.app"
    ports:
      http: "8006"
    subuid: "101000"
    dependency:
      web: "app-public"
      db: "postgresql"
  collabora:
    domain:
      public: "collabora"
      internal: "collabora.app"
    ports:
      http: "9980"
    subuid: "101000"
    dependency:
      web: "app-public"
  oxicloud:
    domain:
      public: "oxicloud"
      internal: "oxicloud.app"
    ports:
      http: "8007"
    subuid: "101000"
    dependency:
      web: "app-public"
      db: "postgresql"
  immich:
    domain:
      public: "immich"
      internal: "immich.app"
    ports:
      http: "2283"
      valkey: "6381"
    dependency:
      web: "app-public"
      db: "postgresql"
  immich-ml:
    ports:
      http: "3003"
  outline:
    domain:
      public: "outline"
      internal: "outline.app"
    ports:
      http: "3004"
      valkey: "6382"
    subuid: "101000"
    dependency:
      web: "app-public"
      db: "postgresql"
  bookstack:
    domain:
      public: "bookstack"
      internal: "bookstack.app"
    ports:
      http: "8004"
    subuid: "100032"
    dependency:
      web: "app-public"
      db: "mariadb"
  sure:
    domain:
      public: "sure"
      internal: "sure.app"
    ports:
      http: "3006"
      valkey: "6383"
    subuid: "100999"
    dependency:
      web: "app-public"
      db: "postgresql"
  readur:
    domain:
      public: "readur"
      internal: "readur.app"
    ports:
      http: "8011"
    dependency:
      web: "app-public"
      db: "postgresql"
  tandoor:
    domain:
      public: "tandoor"
      internal: "tandoor.app"
    ports:
      http: "8003"
    dependency:
      web: "app-public"
      db: "postgresql"
  homebox:
    domain:
      public: "homebox"
      internal: "homebox.app"
    ports:
      http: "7745"
    dependency:
      web: "app-public"
      db: "postgresql"

version:
  build:
    postfix:
      base: "13-slim"
      package: "3.10.13-0+deb13u1"
  packages:
    sops: "3.13.2"
    step: "0.30.2"
    kopia: "0.23.1"
    blocky: "0.33.0"
    alloy: "1.17.1"
  containers:
    # common
    caddy: "2.11.9"
    # infra
    rustfs: "1.0.5"
    ca: "0.30.2"
    ## Postgresql
    postgresql: "18.7"
    ## Mariadb
    mariadb: "13.0.2"
    ### For immich - https://github.com/immich-app/base-images/blob/main/postgres/versions.yaml
    vectorchord: "1.1.1"
    ## lldap
    ldap: "v0.6.3"
    ## mail
    postfix: "3.10.13"
    dovecot: "2.4.5"
    x509-exporter: "4.2.4"
    prometheus: "v3.16.0"
    loki: "3.7.9"
    grafana: "13.3.1"
    # Auth
    authelia: "4.39.28"
    # App
    vaultwarden: "1.37.5"
    forgejo: "17.0.1"
    valkey: "9.1.3"
    immich: "v3.4.1"
    collabora: "26.04.6.1.1"
    sure: "0.7.6"
    outline: "1.12.0"
    homebox: "0.27.1"
    homepage: "v2.8.0"
    snappymail: "v3.0.1.2"
    mastodon: "v4.7.5"
    readur: "3.1.2"
    quartermaster: "v1.9.1"
    tandoor: "2.7.2"
    bookstack: "26.9.3"
    linkding: "1.47.0"
    openwebui: "v0.13.3"
    # https://github.com/leejet/stable-diffusion.cpp/pkgs/container/stable-diffusion.cpp
    # master-sycl@sha256:f27ebe3fea7dcb5978241425d3a115ba6736cfc33c42e75233f22f7411449e9c has problem in it, it cannot get vRAM from UMA properly
    # Pin due to a SYCL/UMA false-OOM regression in newer stable-diffusion.cpp ModelManager memory accounting.
    kaneo: "2.49.0"
    oxicloud: "0.10.0"
