---
- name: Create prometheus directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/containers/{{ item }}"
    state: "directory"
    owner: "{{ services['prometheus']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "prometheus"
    - "prometheus/etc"
    - "prometheus/data"
    - "prometheus/ssl"
  become: true

- name: Deploy prometheus configuration file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/prometheus/etc/{{ item }}.j2"
    dest: "{{ node['home_path'] }}/containers/prometheus/etc/{{ item }}"
    owner: "{{ services['prometheus']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0600"
  loop:
    - "prometheus.yaml"
    - "rules.yaml"
    - "web-config.yaml"
  become: true
  notify: "notification_restart_prometheus"
  no_log: true

- name: Deploy prometheus certificate and key
  ansible.builtin.copy:
    content: |
      {{ item.value }}
    dest: "{{ node['home_path'] }}/containers/prometheus/ssl/{{ item.name }}"
    owner: "{{ services['prometheus']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "{{ item.mode }}"
  loop:
    - name: "{{ root_cert_filename }}"
      value: "{{ hostvars['console']['ca']['root']['crt'] }}"
      mode: "0440"
    - name: "prometheus.crt"
      value: |
        {{ hostvars['console']['prometheus']['crt'] | trim }}
        {{ hostvars['console']['ca']['intermediate']['crt'] }}
      mode: "0440"
    - name: "prometheus.key"
      value: "{{ hostvars['console']['prometheus']['key'] }}"
      mode: "0400"
  become: true
  notify: "notification_restart_prometheus"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "docker.io/prom/prometheus"
    tag: "{{ version['containers']['prometheus'] }}"
    state: "present"
    pull: true

- name: Deploy container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/prometheus/prometheus.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/prometheus.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_prometheus"

- name: Enable prometheus
  ansible.builtin.systemd:
    name: "prometheus.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/docker.io_prom_prometheus_{{ version['containers']['prometheus'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "docker.io/prom/prometheus:{{ version['containers']['prometheus'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/docker.io_prom_prometheus_{{ version['containers']['prometheus'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/docker.io_prom_prometheus_{{ version['containers']['prometheus'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
