---
- name: Create grafana directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/containers/{{ item }}"
    owner: "{{ services['grafana']['subuid'] }}"
    group: "{{ node['group'] }}"
    state: "directory"
    mode: "0770"
  loop:
    - "grafana"
    - "grafana/data"
    - "grafana/etc"
    - "grafana/etc/provisioning"
    - "grafana/etc/provisioning/datasources"
    - "grafana/etc/provisioning/dashboards"
    - "grafana/etc/dashboards"
    - "grafana/ssl"
  become: true

- name: Deploy root certificate and key
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/grafana/ssl/{{ root_cert_filename }}"
    owner: "{{ services['grafana']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0400"
  become: true
  notify: "notification_restart_grafana"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "LDAP_BIND_PASSWORD"
      value: "{{ hostvars['console']['ldap']['password']['services']['grafana'] }}"
    - name: "GF_DB_PASSWORD"
      value: "{{ hostvars['console']['postgresql']['password']['grafana'] }}"
    - name: "GF_ADMIN_PASSWORD"
      value: "{{ hostvars['console']['grafana']['admin']['password'] }}"
  notify: "notification_restart_grafana"
  no_log: true

- name: Deploy configuration files
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/grafana/etc/{{ item }}.j2"
    dest: "{{ node['home_path'] }}/containers/grafana/etc/{{ item }}"
    owner: "{{ services['grafana']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0400"
  loop:
    - "grafana.ini"
    - "ldap.toml"
  become: true
  notify: "notification_restart_grafana"
  no_log: true

- name: Deploy provisioing files
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/grafana/etc/provisioning/{{ item.file }}"
    dest: "{{ node['home_path'] }}/containers/grafana/etc/provisioning/{{ item.dest }}"
    owner: "{{ services['grafana']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0400"
  loop:
    - name: "datasource"
      file: "datasources/datasources.yaml.j2"
      dest: "datasources/datasources.yaml"
    - name: "dashboard"
      file: "dashboards/dashboards.yaml"
      dest: "dashboards/dashboards.yaml"
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: "notification_restart_grafana"

- name: Deploy dashboard files
  ansible.builtin.copy:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/grafana/etc/dashboards/"
    dest: "{{ node['home_path'] }}/containers/grafana/etc/dashboards/"
    owner: "{{ services['grafana']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0400"
  become: true
  notify: "notification_restart_grafana"

- name: Pull image
  containers.podman.podman_image:
    name: "docker.io/grafana/grafana"
    tag: "{{ version['containers']['grafana'] }}"
    state: "present"
    pull: true

- name: Deploy container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/grafana/grafana.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/grafana.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_grafana"

- name: Enable grafana
  ansible.builtin.systemd:
    name: "grafana.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/docker.io_grafana_grafana_{{ version['containers']['grafana'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "docker.io/grafana/grafana:{{ version['containers']['grafana'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/docker.io_grafana_grafana_{{ version['containers']['grafana'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/docker.io_grafana_grafana_{{ version['containers']['grafana'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
