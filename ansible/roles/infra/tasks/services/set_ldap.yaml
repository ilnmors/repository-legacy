---
- name: Create ldap directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/containers/{{ item }}"
    owner: "{{ services['ldap']['subuid'] }}"
    group: "{{ node['group'] }}"
    state: "directory"
    mode: "0770"
  loop:
    - "ldap"
    - "ldap/data"
    - "ldap/ssl"
  become: true

- name: Deploy ldap certificate and key
  ansible.builtin.copy:
    content: |
      {{ item.value }}
    dest: "{{ node['home_path'] }}/containers/ldap/ssl/{{ item.name }}"
    owner: "{{ services['ldap']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "{{ item.mode }}"
  loop:
    - name: "{{ root_cert_filename }}"
      value: "{{ hostvars['console']['ca']['root']['crt'] }}"
      mode: "0440"
    - name: "ldap.crt"
      value: |
        {{ hostvars['console']['ldap']['crt'] | trim }}
        {{ hostvars['console']['ca']['intermediate']['crt'] }}
      mode: "0440"
    - name: "ldap.key"
      value: "{{ hostvars['console']['ldap']['key'] }}"
      mode: "0400"
  become: true
  no_log: true
  notify: "notification_restart_ldap"

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    # urlencode doesn't fix `/` as `%2F`. It needs replace
    - name: "LLDAP_DATABASE_URL"
      value: "postgres://ldap:{{ hostvars['console']['postgresql']['password']['ldap'] | urlencode | replace('/', '%2F') }}\
        @{{ services['postgresql']['domain']['internal'] }}.{{ domain['internal'] }}/\
        ldap_db?sslmode=verify-full&sslrootcert=/etc/ssl/ldap/{{ root_cert_filename }}"
    - name: "LLDAP_KEY_SEED"
      value: "{{ hostvars['console']['ldap']['seed_key'] }}"
    - name: "LLDAP_JWT_SECRET"
      value: "{{ hostvars['console']['ldap']['jwt_secret'] }}"
  no_log: true
  notify: "notification_restart_ldap"

- name: Initiate ldap (When = false, If DB data does not exist in postgresql, activate this block)
# The reason why this task doesn't use the way to check ".init" file is this tasks can override original database.
# Absent of ".init" file cannot guarantee DB is empty.
  when: false
  no_log: true
  block:
    - name: Register extra secret value to podman secret
      containers.podman.podman_secret:
        name: "LLDAP_LDAP_USER_PASS"
        data: "{{ hostvars['console']['ldap']['password']['services']['admin'] }}"
        state: "present"
        force: true
    # You must check the image version first (following container file on data/config/containers/infra/ldap/ldap.container)

    - name: Initiate ldap
      containers.podman.podman_container:
        name: "init_LLDAP"
        image: "docker.io/lldap/lldap:{{ version['containers']['ldap'] }}"
        rm: true
        detach: false
        env:
          TZ: "{{ timezone }}"
          LLDAP_LDAP_BASE_DN: "{{ domain['dc'] }}"
        secrets:
          - "LLDAP_DATABASE_URL,type=env"
          - "LLDAP_KEY_SEED,type=env"
          - "LLDAP_JWT_SECRET,type=env"
          - "LLDAP_LDAP_USER_PASS,type=env"
        volumes:
          - "{{ node['home_path'] }}/containers/ldap/data:/data:rw"
          - "{{ node['home_path'] }}/containers/ldap/ssl:/etc/ssl/ldap:ro"
        etc_hosts:
          "{{ {} | combine({ services['postgresql']['domain']['internal'] ~ '.' ~ domain['internal']: 'host-gateway' }) }}"

  always:
    - name: Clean extra secret value from podman secret
      containers.podman.podman_secret:
        name: "LLDAP_LDAP_USER_PASS"
        state: "absent"

- name: Pull image
  containers.podman.podman_image:
    name: "docker.io/lldap/lldap"
    tag: "{{ version['containers']['ldap'] }}"
    state: "present"
    pull: true

- name: Deploy container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/infra/ldap/ldap.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/ldap.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_ldap"

- name: Enable ldap
  ansible.builtin.systemd:
    name: "ldap.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/docker.io_lldap_lldap_{{ version['containers']['ldap'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "docker.io/lldap/lldap:{{ version['containers']['ldap'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/docker.io_lldap_lldap_{{ version['containers']['ldap'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/docker.io_lldap_lldap_{{ version['containers']['ldap'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
