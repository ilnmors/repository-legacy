---
- name: Restart ca
  ansible.builtin.systemd:
    name: "ca.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  changed_when: false
  listen: "notification_restart_ca"
  ignore_errors: true # noqa: ignore-errors

- name: Reload postgresql
  ansible.builtin.command:
    /usr/bin/podman exec -u postgres postgresql sh -c "pg_ctl reload"
  when: is_postgresql_init_marker.stat.exists
  changed_when: false
  listen: "notification_reload_postgresql"
  ignore_errors: true # noqa: ignore-errors

- name: Restart postgresql
  ansible.builtin.systemd:
    name: "postgresql.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  when: is_postgresql_init_marker.stat.exists
  changed_when: false
  listen: "notification_restart_postgresql"
  ignore_errors: true # noqa: ignore-errors

