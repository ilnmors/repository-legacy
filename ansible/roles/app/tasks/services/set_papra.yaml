---
- name: Create papra directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ services['papra']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/papra"
    - "data/containers/papra/data"
    - "data/containers/papra/backup"
  become: true

- name: Pull image
  containers.podman.podman_image:
    name: "ghcr.io/papra-hq/papra"
    tag: "{{ version['containers']['papra'] }}"
    state: "present"
    pull: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "PAPRA_AUTH_SECRET"
      value: "{{ hostvars['console']['papra']['secret_key'] }}"
    - name: "PAPRA_AUTH_PROVIDERS_CUSTOMS"
      value: |
        [
          {
            "providerId": "authelia",
            "providerName": "Authelia",
            "providerIconUrl": "https://www.authelia.com/images/branding/logo-cropped.png",
            "clientId": "papra",
            "clientSecret": "{{ hostvars['console']['papra']['oidc']['secret'] }}",
            "type": "oidc",
            "discoveryUrl": "https://{{ services['authelia']['domain']['public'] }}.{{ domain['public'] }}/.well-known/openid-configuration",
            "scopes": ["openid", "profile", "email"]
          }
        ]
  notify: "notification_restart_papra"
  no_log: true

- name: Deploy papra.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/papra/papra.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/papra.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  become: true
  notify: "notification_restart_papra"

- name: Deploy papra-backup service
  ansible.builtin.copy:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/papra/services/{{ item }}"
    dest: "{{ node['home_path'] }}/.config/systemd/user/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  loop:
    - "papra-backup.service"
    - "papra-backup.timer"

- name: Deploy papra exporter
  ansible.builtin.copy:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/papra/script/papra-exporter.sh"
    dest: "{{ node['home_path'] }}/data/containers/papra/"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0755"

- name: Enable papra.service
  ansible.builtin.systemd:
    name: "papra.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Enable papra-backup.timer
  ansible.builtin.systemd:
    name: "papra-backup.timer"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/ghcr.io_papra-hq_papra_{{ version['containers']['papra'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "ghcr.io/papra-hq/papra:{{ version['containers']['papra'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/ghcr.io_papra-hq_papra_{{ version['containers']['papra'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/ghcr.io_papra-hq_papra_{{ version['containers']['papra'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
