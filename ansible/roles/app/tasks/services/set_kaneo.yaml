---
- name: Create kaneo directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ services['kaneo']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "containers/kaneo"
    - "containers/kaneo/ssl"
  become: true

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/kaneo/ssl/{{ root_cert_filename }}"
    owner: "{{ services['kaneo']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_kaneo"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "KANEO_AUTH_SECRET"
      value: "{{ hostvars['console']['kaneo']['secret_key'] }}"
    - name: "KANEO_DB_PASSWORD"
      value: "{{ hostvars['console']['postgresql']['password']['kaneo'] }}"
    - name: "KANEO_OIDC_CLIENT_SECRET"
      value: "{{ hostvars['console']['kaneo']['oidc']['secret'] }}"
    - name: "KANEO_S3_SECRET_KEY"
      value: "{{ hostvars['console']['rustfs']['password']['kaneo'] }}"
  notify: "notification_restart_kaneo"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "ghcr.io/usekaneo/kaneo"
    tag: "{{ version['containers']['kaneo'] }}"
    state: "present"
    pull: true

- name: Deploy kaneo.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/kaneo/kaneo.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/kaneo.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_kaneo"

- name: Enable kaneo.service
  ansible.builtin.systemd:
    name: "kaneo.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/ghcr.io_usekaneo_kane_{{ version['containers']['kaneo'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "ghcr.io/usekaneo/kaneo:{{ version['containers']['kaneo'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/ghcr.io_usekaneo_kane_{{ version['containers']['kaneo'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/ghcr.io_usekaneo_kane_{{ version['containers']['kaneo'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
