---
# Prerequisites created outside this task (see docs/operating/readur in the repository):
# - PostgreSQL role "readur" and database "readur_db" on infra
# - RustFS bucket "readur" and service account "readur" with a policy limited to that bucket
- name: Create readur directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/readur"
    - "data/containers/readur/uploads"
    - "data/containers/readur/watch"
    - "containers/readur"
    - "containers/readur/ssl"
    - "containers/readur/patches"
  become: true

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/readur/ssl/{{ root_cert_filename }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0444"
  become: true
  notify: "notification_restart_readur"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "ghcr.io/readur/readur"
    tag: "{{ version['containers']['readur'] }}"
    state: "present"
    pull: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "READUR_JWT_SECRET"
      value: "{{ hostvars['console']['readur']['jwt_secret'] }}"
    - name: "READUR_DATABASE_URL"
      value: "postgresql://readur:{{ hostvars['console']['postgresql']['password']['readur'] | urlencode | replace('/', '%2F') }}\
        @{{ services['postgresql']['domain']['internal'] }}.{{ domain['internal'] }}/readur_db?sslmode=verify-full&\
        sslrootcert=/etc/ssl/readur/{{ root_cert_filename }}"
    - name: "READUR_OIDC_CLIENT_SECRET"
      value: "{{ hostvars['console']['readur']['oidc']['secret'] }}"
    - name: "READUR_S3_SECRET_KEY"
      value: "{{ hostvars['console']['rustfs']['password']['readur'] }}"
  notify: "notification_restart_readur"
  no_log: true

# Readur always opens a document on the Text tab (extracted text). Rewrite the
# drawer chunk of the pulled image to open on the Details tab and mount it over
# the original. The chunk name carries a build hash, so it is looked up per image.
- name: Find the readur document drawer chunk
  ansible.builtin.shell: |
    set -o pipefail
    podman run --rm --network=none --entrypoint sh "ghcr.io/readur/readur:{{ version['containers']['readur'] }}" \
      -c 'ls /app/frontend/dist/assets' | grep -E '^DocumentDrawer-[A-Za-z0-9_-]+\.js$'
  args:
    executable: "/bin/bash"
  register: "readur_drawer_chunk_result"
  changed_when: false

- name: Set the readur drawer chunk name
  ansible.builtin.set_fact:
    readur_drawer_chunk: "{{ readur_drawer_chunk_result.stdout_lines | first }}"
  failed_when: (readur_drawer_chunk_result.stdout_lines | length) != 1

- name: Read the readur document drawer chunk
  ansible.builtin.command: >-
    podman run --rm --network=none --entrypoint cat "ghcr.io/readur/readur:{{ version['containers']['readur'] }}"
    /app/frontend/dist/assets/{{ readur_drawer_chunk }}
  register: "readur_drawer_source"
  changed_when: false

- name: Check the readur tab defaults
  ansible.builtin.assert:
    that:
      - (readur_drawer_source.stdout | regex_findall('useState\)\(`text`\)') | length) == 1
      - (readur_drawer_source.stdout | regex_findall('\|\|c\(`text`\)') | length) == 1
    fail_msg: "The Readur drawer code changed; update the Details tab patch before upgrading."
    quiet: true

- name: Deploy the readur drawer patch
  ansible.builtin.copy:
    content: >-
      {{ readur_drawer_source.stdout
      | regex_replace('useState\)\(`text`\)', 'useState)(`details`)')
      | regex_replace('\|\|c\(`text`\)', '||c(`details`)') }}
    dest: "{{ node['home_path'] }}/containers/readur/patches/{{ readur_drawer_chunk }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_readur"

- name: Deploy readur.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/readur/readur.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/readur.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_readur"

- name: Enable readur.service
  ansible.builtin.systemd:
    name: "readur.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/ghcr.io_readur_readur_{{ version['containers']['readur'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "ghcr.io/readur/readur:{{ version['containers']['readur'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/ghcr.io_readur_readur_{{ version['containers']['readur'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/ghcr.io_readur_readur_{{ version['containers']['readur'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
