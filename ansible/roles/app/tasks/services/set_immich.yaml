---
- name: Set valkey service name
  ansible.builtin.set_fact:
    valkey_service: "immich"

- name: Create valkey_immich directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ services['valkey']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "containers/valkey"
    - "containers/valkey/{{ valkey_service }}"
    - "containers/valkey/{{ valkey_service }}/data"
  become: true

- name: Deploy valkey config file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/valkey/valkey.conf.j2"
    dest: "{{ node['home_path'] }}/containers/valkey/{{ valkey_service }}/valkey.conf"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  register: "is_valkey_conf"

- name: Deploy valkey container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/valkey/valkey.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/valkey_{{ valkey_service }}.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  register: "is_valkey_containerfile"

- name: Enable (Restart) valkey service
  ansible.builtin.systemd:
    name: "valkey_{{ valkey_service }}.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  when: is_valkey_conf.changed or is_valkey_containerfile.changed # noqa: no-handler

- name: Create immich directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/immich"
    - "data/containers/immich/data"
    - "containers/immich"
    - "containers/immich/ssl"
    - "containers/immich/ml"
    - "containers/immich/ml/cache"

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/immich/ssl/{{ root_cert_filename }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  notify: "notification_restart_immich"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "IMMICH_DB_PASSWORD"
    data: "{{ hostvars['console']['postgresql']['password']['immich'] }}"
    state: "present"
    force: true
  notify: "notification_restart_immich"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "{{ item.image }}"
    tag: "{{ item.tag }}"
    state: "present"
    pull: true
  loop:
    - name: "immich_ml"
      image: "ghcr.io/immich-app/immich-machine-learning"
      tag: "{{ version['containers']['immich'] }}-openvino"
    - name: "immich"
      image: "ghcr.io/immich-app/immich-server"
      tag: "{{ version['containers']['immich'] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy immich.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/immich/immich.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/immich.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_immich"

- name: Deploy immich-ml.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/immich/immich-ml.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/immich-ml.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_immich-ml"

- name: Enable immich.service
  ansible.builtin.systemd:
    name: "immich.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Enable immich-ml.service
  ansible.builtin.systemd:
    name: "immich-ml.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/{{ item.file }}.tar"
  loop:
    - name: "valkey"
      image: "docker.io/valkey/valkey:{{ version['containers']['valkey'] }}"
      file: "docker.io_valkey_valkey_{{ version['containers']['valkey'] }}"
    - name: "immich_ml"
      image: "ghcr.io/immich-app/immich-machine-learning:{{ version['containers']['immich'] }}-openvino"
      file: "ghcr.io_immich-app_immich-machine-learning_{{ version['containers']['immich'] }}-openvino"
    - name: "immich"
      image: "ghcr.io/immich-app/immich-server:{{ version['containers']['immich'] }}"
      file: "ghcr.io_immich-app_immich-server_{{ version['containers']['immich'] }}"
  loop_control:
    label: "{{ item.name }}"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "{{ item.item.image }}"
    dest: "{{ node['home_path'] }}/archives/containers/{{ item.item.file }}.tar"
    format: "oci-archive"
    force: false
  loop: "{{ container_archive_images.results }}"
  loop_control:
    label: "{{ item.item.file }}"
  when: not item.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/{{ item.item.file }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
  loop: "{{ container_archive_images.results }}"
  loop_control:
    label: "{{ item.item.file }}"
