---
- name: Create homebox directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/homebox"
    - "data/containers/homebox/data"
    - "containers/homebox"
    - "containers/homebox/ssl"

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/homebox/ssl/{{ root_cert_filename }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  notify: "notification_restart_homebox"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "HBOX_AUTH_API_KEY_PEPPER"
      value: "{{ hostvars['console']['homebox']['api_secret'] }}"
    - name: "HBOX_DATABASE_PASSWORD"
      value: "{{ hostvars['console']['postgresql']['password']['homebox'] }}"
    - name: "HBOX_OIDC_CLIENT_SECRET"
      value: "{{ hostvars['console']['homebox']['oidc']['secret'] }}"
  notify: "notification_restart_homebox"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "ghcr.io/sysadminsmedia/homebox"
    tag: "{{ version['containers']['homebox'] }}"
    state: "present"
    pull: true

- name: Deploy homebox.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/homebox/homebox.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/homebox.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_homebox"

- name: Enable homebox.service
  ansible.builtin.systemd:
    name: "homebox.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/ghcr.io_sysadminsmedia_homebox_{{ version['containers']['homebox'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "ghcr.io/sysadminsmedia/homebox:{{ version['containers']['homebox'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/ghcr.io_sysadminsmedia_homebox_{{ version['containers']['homebox'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/ghcr.io_sysadminsmedia_homebox_{{ version['containers']['homebox'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
