---
- name: Create booklogr directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/booklogr"
    - "data/containers/booklogr/profile_pictures"
    - "data/containers/booklogr/export_data"
    - "containers/booklogr"
    - "containers/booklogr/ssl"
  become: true


- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/booklogr/ssl/{{ root_cert_filename }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_booklogr"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "BOOKLOGR_AUTH_SECRET_KEY"
      value: "{{ hostvars['console']['booklogr']['secret_key'] }}"
    - name: "BOOKLOGR_POSTGRES_PASSWORD"
      value: "{{ hostvars['console']['postgresql']['password']['booklogr'] }}"
    - name: "BOOKLOGR_OIDC_CLIENT_SECRET"
      value: "{{ hostvars['console']['booklogr']['oidc']['secret'] }}"
  notify: "notification_restart_booklogr"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "{{ item }}"
    tag: "{{ version['containers']['booklogr'] }}"
    state: "present"
    pull: true
  loop:
    - "docker.io/mozzo/booklogr"
    - "docker.io/mozzo/booklogr-web"

- name: Deploy booklogr.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/booklogr/{{ item }}.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  loop:
    - "booklogr-api.container"
    - "booklogr-web.container"
  notify: "notification_restart_booklogr"

- name: Enable booklogr.service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"
  loop:
    - "booklogr-api.service"
    - "booklogr-web.service"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/{{ item.file }}.tar"
  loop:
    - name: "booklogr"
      image: "docker.io/mozzo/booklogr:{{ version['containers']['booklogr'] }}"
      file: "docker.io_mozzo_booklogr_{{ version['containers']['booklogr'] }}"
    - name: "booklogr-web"
      image: "docker.io/mozzo/booklogr-web:{{ version['containers']['booklogr'] }}"
      file: "docker.io_mozzo_booklogr-web_{{ version['containers']['booklogr'] }}"
  loop_control:
    label: "{{ item.name }}"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "{{ item.item.image }}"
    dest: "{{ node['home_path'] }}/archives/containers/{{ item.item.file }}.tar"
    format: "oci-archive"
    force: false
  loop: "{{ container_archive_images.results }}"
  loop_control:
    label: "{{ item.item.file }}"
  when: not item.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/{{ item.item.file }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
  loop: "{{ container_archive_images.results }}"
  loop_control:
    label: "{{ item.item.file }}"
