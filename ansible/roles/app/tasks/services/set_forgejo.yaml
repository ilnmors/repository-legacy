---
- name: Create forgejo directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ services['forgejo']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/forgejo"
    - "data/containers/forgejo/data"
    - "containers/forgejo"
    - "containers/forgejo/ssl"
  become: true

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/forgejo/ssl/{{ root_cert_filename }}"
    owner: "{{ services['forgejo']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_forgejo"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "FORGEJO__database__PASSWD"
    data: "{{ hostvars['console']['postgresql']['password']['forgejo'] }}"
    state: "present"
    force: true
  notify: "notification_restart_forgejo"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "codeberg.org/forgejo/forgejo"
    tag: "{{ version['containers']['forgejo'] }}"
    state: "present"
    pull: true

- name: Deploy container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/forgejo/forgejo.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/forgejo.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_forgejo"

- name: Enable forgejo.service
  ansible.builtin.systemd:
    name: "forgejo.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

# The OAuth2 login source lives in the forgejo database (no app.ini/env option):
# add it when missing, otherwise update it so the client secret and URL follow secrets.yaml.
- name: Wait for forgejo CLI
  ansible.builtin.command: "podman exec -u git forgejo forgejo admin auth list"
  register: "forgejo_auth_list"
  retries: 30
  delay: 5
  until: forgejo_auth_list.rc == 0
  changed_when: false

- name: Set authelia login source id
  ansible.builtin.set_fact:
    forgejo_authelia_source_id: >-
      {{
        forgejo_auth_list.stdout_lines
        | select('search', '^\\d+\\s+authelia\\s')
        | map('regex_replace', '^(\\d+)\\s.*$', '\\1')
        | first | default('')
      }}

- name: Add or update authelia login source
  vars:
    forgejo_authelia_url: "https://{{ services['authelia']['domain']['public'] }}.{{ domain['public'] }}"
  environment:
    FORGEJO_OIDC_SECRET: "{{ hostvars['console']['forgejo']['oidc']['secret'] }}"
  ansible.builtin.command:
    argv:
      - "podman"
      - "exec"
      - "-u"
      - "git"
      - "-e"
      - "FORGEJO_OIDC_SECRET"
      - "forgejo"
      - "sh"
      - "-c"
      - >-
        exec forgejo admin auth
        {{ ('update-oauth --id ' ~ forgejo_authelia_source_id) if (forgejo_authelia_source_id | length) > 0 else 'add-oauth' }}
        --name authelia
        --provider openidConnect
        --key forgejo
        --secret "$FORGEJO_OIDC_SECRET"
        --auto-discover-url "{{ forgejo_authelia_url }}/.well-known/openid-configuration"
        --scopes openid --scopes email --scopes profile
  # update-oauth runs every time and cannot report a diff; only a new source counts as a change.
  changed_when: (forgejo_authelia_source_id | length) == 0
  no_log: true

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/codeberg.org_forgejo_forgejo_{{ version['containers']['forgejo'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "codeberg.org/forgejo/forgejo:{{ version['containers']['forgejo'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/codeberg.org_forgejo_forgejo_{{ version['containers']['forgejo'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/codeberg.org_forgejo_forgejo_{{ version['containers']['forgejo'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
