- name: Restart affine
  ansible.builtin.systemd:
    name: "affine.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  when: is_affine_init.stat.exists
  changed_when: false
  listen: "notification_restart_affine"
  ignore_errors: true # noqa: ignore-errors

- name: Restart nextcloud
  ansible.builtin.systemd:
    name: "nextcloud.service"
    state: "restarted"
    enabled: true
    daemon_reload: true
    scope: "user"
  when: is_nextcloud_init.stat.exists
  changed_when: false
  listen: "notification_restart_nextcloud"
  ignore_errors: true # noqa: ignore-errors

- name: Restart collabora
  ansible.builtin.systemd:
    name: "collabora.service"
    state: "restarted"
    enabled: true
    scope: "user"
    daemon_reload: true
  changed_when: false
  listen: "notification_restart_collabora"
  ignore_errors: true # noqa: ignore-errors

- name: Restart sure
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "restarted"
    enabled: true
    scope: "user"
    daemon_reload: true
  loop:
    - "sure-web.service"
    - "sure-worker.service"
  changed_when: false
  listen: "notification_restart_sure"
  ignore_errors: true # noqa: ignore-errors
