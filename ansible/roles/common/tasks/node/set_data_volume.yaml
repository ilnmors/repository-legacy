---
- name: Check data volume filesystem already exists
  ansible.builtin.command: |
    blkid /dev/{{ vm['data_storage']['name'] }}
  register: is_volume
  changed_when: false
  failed_when: false
  become: true

- name: Create ext4 filesystem on data raw
  ansible.builtin.command: |
    mkfs.ext4 -F /dev/{{ vm['data_storage']['name'] }}
  when: is_volume.rc != 0
  changed_when: true
  become: true

- name: Set data volume path
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/data"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"

- name: Mount data volume
  ansible.posix.mount:
    path: "{{ node['home_path'] }}/data"
    src: "/dev/{{ vm['data_storage']['name'] }}"
    opts: "noatime"
    state: "mounted"
    fstype: "ext4"
  become: true

- name: Set data volume path permissions
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/data"
    state: "directory"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  become: true
