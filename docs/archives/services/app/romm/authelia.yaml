identity_providers:
  oidc:
    claims_policies:
      romm:
        id_token:
          - 'email'
          - 'email_verified'
          - 'alt_emails'
          - 'preferred_username'
          - 'name'
          - 'groups'
    clients:
      # https://www.authelia.com/integration/openid-connect/clients/romm/
      - client_id: 'romm'
        claims_policy: 'romm'
        client_name: 'romm'
        consent_mode: 'implicit'
        client_secret: ''
        public: false
        authorization_policy: 'one_factor'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://romm.example.com/api/oauth/openid'
        scopes:
          - 'openid'
          - 'groups'
          - 'profile'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
