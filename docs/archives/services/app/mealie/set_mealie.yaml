---
- name: Create mealie directory
  ansible.builtin.file:
    path: "{{ node['home_path'] }}/{{ item }}"
    state: "directory"
    owner: "{{ services['mealie']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0770"
  loop:
    - "data/containers/mealie"
    - "data/containers/mealie/data"
    - "containers/mealie"
    - "containers/mealie/ssl"
  become: true

- name: Deploy root certificate
  ansible.builtin.copy:
    content: |
      {{ hostvars['console']['ca']['root']['crt'] }}
    dest: "{{ node['home_path'] }}/containers/mealie/ssl/{{ root_cert_filename }}"
    owner: "{{ services['mealie']['subuid'] }}"
    group: "{{ node['group'] }}"
    mode: "0440"
  become: true
  notify: "notification_restart_mealie"
  no_log: true

- name: Register secret value to podman secret
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ item.value }}"
    state: "present"
    force: true
  loop:
    - name: "MEALIE_POSTGRES_PASSWORD"
      value: "{{ hostvars['console']['postgresql']['password']['mealie'] }}"
    - name: "MEALIE_OIDC_CLIENT_SECRET"
      value: "{{ hostvars['console']['mealie']['oidc']['secret'] }}"
  notify: "notification_restart_mealie"
  no_log: true

- name: Pull image
  containers.podman.podman_image:
    name: "ghcr.io/mealie-recipes/mealie"
    tag: "{{ version['containers']['mealie'] }}"
    state: "present"
    pull: true

- name: Deploy mealie.container file
  ansible.builtin.template:
    src: "{{ hostvars['console']['node']['config_path'] }}/services/containers/app/mealie/mealie.container.j2"
    dest: "{{ node['home_path'] }}/.config/containers/systemd/mealie.container"
    owner: "{{ ansible_user }}"
    group: "{{ node['group'] }}"
    mode: "0644"
  notify: "notification_restart_mealie"

- name: Enable mealie.service
  ansible.builtin.systemd:
    name: "mealie.service"
    state: "started"
    enabled: true
    daemon_reload: true
    scope: "user"

- name: Check container archive images
  ansible.builtin.stat:
    path: "{{ node['home_path'] }}/archives/containers/ghcr.io_mealie-recipes_mealie_{{ version['containers']['mealie'] }}.tar"
  register: container_archive_images

- name: Save container archive images
  containers.podman.podman_save:
    image:
      - "ghcr.io/mealie-recipes/mealie:{{ version['containers']['mealie'] }}"
    dest: "{{ node['home_path'] }}/archives/containers/ghcr.io_mealie-recipes_mealie_{{ version['containers']['mealie'] }}.tar"
    format: "oci-archive"
    force: false
  when: not container_archive_images.stat.exists

- name: Fetch container archive images
  ansible.builtin.fetch:
    src: "{{ node['home_path'] }}/archives/containers/ghcr.io_mealie-recipes_mealie_{{ version['containers']['mealie'] }}.tar"
    dest: "{{ hostvars['console']['node']['data_path'] }}/images/containers/"
    flat: true
