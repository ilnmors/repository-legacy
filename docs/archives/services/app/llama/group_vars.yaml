services:
  llama:
    ports:
      http: "10000"
    dependency:
      models:
        default: |
          n-gpu-layers = all
          kv-unified = true
          cache-prompt = true
          cache-type-k = q8_0
          cache-type-v = q8_0
          flash-attn = auto
          reasoning = off
          jinja = true
          lazy-mode = off
        LFM2.5-24B-A2B-Heretic: |
          model = /models/LFM2.5-24B-A2B-Heretic/model.gguf
          c = 65536
          parallel = 2
          reasoning = on
          load-on-startup = true
        LFM2.5-VL-3B-Heretic: |
          model = /models/LFM2.5-VL-3B-Heretic/model.gguf
          mmproj = /models/LFM2.5-VL-3B-Heretic/mmproj.gguf
          c = 32768
          parallel = 1
          load-on-startup = true
        LFM2.5-Embedding-350M: |
          model = /models/LFM2.5-Embedding-350M/model.gguf
          embedding = true
          pooling = cls
          c = 1024
          parallel = 1
          load-on-startup = true
