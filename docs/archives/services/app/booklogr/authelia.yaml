identity_providers:
  oidc:
    cors:
      # booklogr cors configuration
      endpoints:
        - 'authorization'
        - 'token'
        - 'userinfo'
      allowed_origins:
        - 'https://booklogr.example.com'
    clients:
      # https://booklogr.app/docs/Configuration/OIDC-sign-in
      - client_id: 'booklogr'
        client_name: 'booklogr'
        consent_mode: 'implicit'
        client_secret: ''
        public: false
        authorization_policy: 'one_factor'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://booklogr.example.com/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
